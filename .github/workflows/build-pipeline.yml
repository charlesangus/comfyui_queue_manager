# GitHub CI build pipeline
name: comfyui_queue_manager CI build

on:
  pull_request:
    branches:
      - master
      - main
jobs:
  build:
    runs-on:  ${{ matrix.os }} 
    env:
      PYTHONIOENCODING: "utf8"
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version:  ${{ matrix.python-version }} 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Run Linting
        run: |
          ruff check .
      - name: Run Tests
        run: |
          pytest tests/

  gui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/gui
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/gui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Linting
        run: npm run lint
      - name: Run Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Check built bundle is up to date
        run: |
          test -z "$(git status --porcelain --untracked-files=all -- ../../web/.gui)"
